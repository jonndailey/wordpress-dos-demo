; Dailey OS — raise PHP upload limits above the stock wordpress:apache 2M/8M.
;
; With the stock caps, uploading a theme/plugin zip or media file larger than
; post_max_size makes PHP silently discard the entire request body — including
; WordPress's security nonce — so WP renders the misleading
; "The link you followed has expired." page. These limits let normal-sized
; theme/plugin/media uploads go through cleanly.
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300
max_file_uploads = 30
; Premium themes/page builders (e.g. Salient) require max_input_vars >= 2000 to
; save large option panels, menus, and widget sets; stock PHP default is 1000.
max_input_vars = 5000
max_input_time = 300
