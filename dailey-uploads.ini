; Dailey OS — raise PHP upload limits above the stock wordpress:apache 2M/8M.
;
; With the stock caps, uploading a theme/plugin zip or media file larger than
; post_max_size makes PHP silently discard the entire request body — including
; WordPress's security nonce — so WP renders the misleading
; "The link you followed has expired." page. These limits let normal-sized
; theme/plugin/media uploads go through cleanly.
;
; 600M (vs the prior 128M) so a full-site migration import — e.g. an
; All-in-One WP Migration .wpress file or a large media library — uploads in one
; request. NOTE: memory_limit deliberately stays at 256M — PHP streams file
; uploads to a temp file on disk, so memory_limit need NOT exceed post_max_size,
; and raising it would risk OOM-killing small WP pods. Two more layers gate a
; large upload beyond PHP: (1) the nginx-ingress proxy-body-size annotation on
; the project's Ingress must also be >= the file size (set per-deploy, not here),
; and (2) a 600M browser upload is fragile (timeouts) — for very large sites the
; reliable path is import the DB/content and sync wp-content/uploads to R2.
upload_max_filesize = 600M
post_max_size = 600M
memory_limit = 256M
max_execution_time = 600
max_file_uploads = 30
; Premium themes/page builders (e.g. Salient) require max_input_vars >= 2000 to
; save large option panels, menus, and widget sets; stock PHP default is 1000.
max_input_vars = 5000
max_input_time = 300
